<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}body{padding:54px 58px;background:#f5f1e8;color:#151713;font-family:Arial,sans-serif}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:15px;font-size:25px;font-weight:900}.mark{width:48px;height:48px;display:grid;place-items:center;background:#ff5b1f;color:white;border:3px solid #151713;box-shadow:5px 5px 0 #151713;font-size:17px}.review{font:700 14px ui-monospace,monospace;color:#6c6f67}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:58px;align-items:center;height:470px}.eyebrow{margin:0 0 20px;color:#d93b00;font-size:15px;font-weight:900;letter-spacing:2px;text-transform:uppercase}h1{margin:0;max-width:650px;font:500 66px/.93 Georgia,serif;letter-spacing:-3px}.lede{max-width:610px;margin:25px 0 0;color:#545750;font-size:20px;line-height:1.5}.diagram{padding:27px;background:#151713;color:white;box-shadow:12px 12px 0 #ff5b1f}.formula{margin:0 0 21px;color:#d9f55c;font:800 18px/1.4 ui-monospace,monospace}.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;padding:13px;border:1px solid #575b52;background:#242720}.step span{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#3158e7;font-weight:900}.step strong{font-size:16px}.url{position:absolute;left:58px;bottom:35px;font:800 15px ui-monospace,monospace}
</style></head><body><div class="top"><div class="brand"><span class="mark">FK</span><span>ShipMathLab</span></div><span class="review">FORMULA + SOURCE + WORKED EXAMPLE</span></div><div class="grid"><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p class="lede" id="lede"></p></div><div class="diagram"><p class="formula" id="formula"></p><div class="steps"><div class="step"><span>1</span><strong id="s1"></strong></div><div class="step"><span>2</span><strong id="s2"></strong></div><div class="step"><span>3</span><strong id="s3"></strong></div><div class="step"><span>4</span><strong id="s4"></strong></div></div></div></div><div class="url" id="url"></div><script>const p=new URLSearchParams(location.search);for(const id of ['eyebrow','title','lede','formula','s1','s2','s3','s4','url'])document.getElementById(id).textContent=p.get(id)||'';</script></body></html>
